  --t-mn:#55D3A3; --t-reg:#C79CEB; --t-dir:#EBA46C; --t-sym:#82B7F3; --t-num:#F28B7C; --t-str:#BCD66C; --t-lbl:#F1F6F3; --t-com:#6D7F77; --t-fn:#6CD0DB; --t-err:#F27A6D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
code,kbd,.mono{font-family:var(--f-mono);font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-3)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand h1{margin:0;font:700 22px/1 var(--f-cond);letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.chip{font:600 11px/1 var(--f-mono);letter-spacing:.02em;padding:4px 6px;border-radius:4px;background:var(--sunk);color:var(--ink-2)}
.transport{display:flex;align-items:center;gap:4px;flex-wrap:wrap;row-gap:6px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.icon{width:30px;padding:0}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{height:26px;padding:0 8px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.ctl{display:flex;align-items:center;gap:6px;font:500 12px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.ctl select{height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);padding:0 6px;font:500 13px var(--f-ui);text-transform:none;letter-spacing:0;color:var(--ink)}
.status{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font:600 12px/1 var(--f-ui);background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.run{background:var(--ok-soft);color:var(--ok)}
.pill.pause{background:var(--warn-soft);color:var(--warn)}
.pill.halt{background:var(--bad-soft);color:var(--bad)}
.clock{font:500 12.5px/1.2 var(--f-mono);color:var(--ink-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- bench layout ---------- */
.bench{display:grid;grid-template-columns:minmax(290px,340px) minmax(0,1fr) minmax(360px,440px);min-height:0}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column}
.sheet{border-right:1px solid var(--line);background:var(--surface)}
.rack{border-left:1px solid var(--line);background:var(--bg);overflow:auto;padding:10px 12px 24px}
.mtabs{display:none}

/* ---------- problem sheet ---------- */
.sheet-scroll{overflow:auto;padding:14px 16px 28px;flex:1;min-height:0}
.eyebrow{font:600 11.5px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.sheet h2{margin:6px 0 4px;font:600 20px/1.2 var(--f-ui);text-wrap:balance}
.sheet h3{margin:18px 0 8px;font:600 12.5px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.progress{font:500 12px var(--f-mono);color:var(--ink-3)}
.plist{display:flex;flex-direction:column;gap:2px}
.pitem{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:8px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;text-align:left;background:none;width:100%}
.pitem:hover{background:var(--sunk)}
.pitem.cur{background:var(--accent-soft);border-color:transparent}
.pitem .t{font-weight:500;line-height:1.25}
.pitem .b{font-size:12px;color:var(--ink-3)}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink-3)}
.dot.att{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.dot.ok{border-color:var(--ok);background:var(--ok)}
.lvl{display:flex;gap:2px}.lvl i{width:5px;height:12px;border-radius:1px;background:var(--line)}.lvl i.on{background:var(--ink-3)}
.samples{display:flex;flex-wrap:wrap;gap:6px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);background:none;border:0;padding:2px 0;cursor:pointer}
.back:hover{color:var(--ink)}
.variant{display:flex;align-items:center;gap:8px;margin:8px 0 10px;flex-wrap:wrap}
.variant .chip{font-weight:500}
.stmt{line-height:1.55}
.stmt p{margin:0 0 10px}
.stmt ol,.stmt ul{margin:0 0 10px;padding-left:20px}
.stmt li{margin:3px 0}
.stmt code,.res code,.hint code{background:var(--sunk);padding:1px 4px;border-radius:3px}
pre.listing{font:12px/1.55 var(--f-mono);background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;overflow:auto;margin:0 0 10px}
pre.listing .ad{color:var(--ink-3)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.form{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.field{display:grid;gap:4px}
.field label,.field .lab{font:600 12px/1.2 var(--f-cond);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.field input,.field select{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:0 8px;font:500 13.5px var(--f-mono);min-width:0}
.field.bad input,.field.bad select{border-color:var(--bad);background:var(--bad-soft)}
.field.good input,.field.good select{border-color:var(--ok)}
.stackform{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.stackform span{font:500 12.5px var(--f-mono);color:var(--ink-2)}
.stackform input{height:28px}
.q{border-top:1px solid var(--line-2);padding-top:10px}
.q .p{margin:0 0 6px}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;border:1px solid var(--line-2);cursor:pointer;background:var(--surface-2)}
.opt:hover{border-color:var(--ink-3)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.circuit{display:block;width:100%;max-width:300px;height:auto;margin:4px 0 8px;color:var(--ink)}
.circuit text{fill:currentColor;stroke:none;font:500 12px var(--f-ui)}
.circuit text.sm{font-size:11.5px}.circuit text.xs{font-size:9px;fill:var(--ink-3);letter-spacing:.08em}.circuit text.lbl{font:700 14px var(--f-mono)}
.circuit tspan.sub{font-size:8px}
.circuit .fillc{fill:currentColor}.circuit .nofill{fill:none}
.circuit .mk{fill:var(--copper);stroke:none}.circuit text.mkt{fill:#fff;font:700 11px var(--f-ui)}
.labelrow{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.labelrow b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--copper);color:#fff;font-size:11px}
.labelrow select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:0 6px}

/* results */
.summary{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin:12px 0 8px;font-weight:600}
.summary.ok{background:var(--ok-soft);color:var(--ok)}
.summary.bad{background:var(--bad-soft);color:var(--bad)}
.summary.run{background:var(--sunk);color:var(--ink-2)}
.summary .n{font:600 13px var(--f-mono);margin-left:auto}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.res li{border:1px solid var(--line-2);border-radius:7px;background:var(--surface-2);overflow:hidden}
.res summary{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 10px;cursor:pointer;list-style:none;align-items:start}
.res summary::-webkit-details-marker{display:none}
.res .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--f-ui);color:#fff;margin-top:1px}
.res .pass .ic{background:var(--ok)}.res .fail .ic{background:var(--bad)}.res .adv .ic{background:var(--warn)}
.res .nm{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.res .det{padding:0 10px 10px 38px;font-size:13px;color:var(--ink-2);line-height:1.5}
.res .det ul{margin:6px 0;padding-left:18px}.res .det p{margin:6px 0}
.res .det .muted{color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto auto;gap:3px 12px;justify-content:start;align-items:center;margin:4px 0;font-size:12px}
.bits{display:inline-flex;font:600 12.5px var(--f-mono);gap:1px}
.bits i{font-style:normal;width:12px;text-align:center;border-radius:2px}
.bits i.b-gap{width:5px}.bits i.b-bad{background:var(--bad);color:#fff}.bits i.b-dim{color:var(--ink-3);opacity:.6}.bits i.b-hi{color:var(--copper)}
.tblwrap{overflow-x:auto;margin:6px 0}
table.calc{border-collapse:collapse;font:12.5px/1.35 var(--f-ui);font-variant-numeric:tabular-nums;min-width:100%}
table.calc th{font:600 11px var(--f-cond);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
table.calc td{padding:4px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.calc tr.pick td{background:var(--accent-soft)}
table.calc td.num{font-family:var(--f-mono)}
.hint{border-left:3px solid var(--copper);background:var(--copper-soft);padding:8px 10px;border-radius:0 6px 6px 0;margin:6px 0;font-size:13.5px;line-height:1.5}
.hint b.k{display:block;font:600 11px var(--f-cond);text-transform:uppercase;letter-spacing:.1em;color:var(--copper);margin-bottom:2px}
.lock{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
/* model solution "Assembly Code | Comments" */
.sol{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);margin:8px 0}
.sol-head{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--sunk)}
.sol-head .eyebrow{margin-right:auto}
.sol .tblwrap{margin:0}
table.asm{border-collapse:collapse;font:12px/1.5 var(--f-mono);width:100%}
table.asm th{font:600 11px var(--f-cond);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:left;padding:5px 10px;border-bottom:1px solid var(--line)}
table.asm td{padding:1px 10px;white-space:pre;vertical-align:top}
table.asm td.c{color:var(--t-com);white-space:normal;font-family:var(--f-ui);font-size:12.5px;border-left:1px solid var(--line-2);min-width:170px}
table.asm tr.hd td{color:var(--t-com);font-style:italic;padding-top:6px}

/* ---------- code pane ---------- */
.code{background:var(--surface-2)}
.edbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.fname{font:600 12.5px var(--f-mono);color:var(--ink-2);display:flex;align-items:center;gap:6px;min-width:0}
.fname b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asmstat{font-size:12.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.asmstat.err{color:var(--bad)}.asmstat.ok{color:var(--ok)}
.ed-scroll{flex:1;min-height:0;overflow:auto;position:relative;background:var(--surface-2)}
.ed-inner{display:grid;grid-template-columns:auto 1fr;min-width:max-content;min-height:100%}
.gutter{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line-2);padding:8px 0;font:400 12px/var(--lh) var(--f-mono);color:var(--ink-3);user-select:none;font-variant-numeric:tabular-nums}
.gl{display:grid;grid-template-columns:16px 3.2ch;height:var(--lh);align-items:center;padding-right:8px;cursor:pointer}
.gutter.addr .gl{grid-template-columns:16px 3.2ch 5ch}
.gl .ad{color:var(--t-sym);opacity:.7;text-align:right}
.gl .n{text-align:right}
.gl .bp{width:10px;height:10px;border-radius:50%;margin-left:4px}
.gl:hover .bp{background:var(--line)}
.gl.hasbp .bp{background:var(--bad)}
.gl.pc .n{color:var(--ink);font-weight:600}
.gl.err .n{color:var(--bad);font-weight:600}
.gl.warn .n{color:var(--warn);font-weight:600}
.edc{position:relative;min-width:0}
.linebg{position:absolute;inset:0;pointer-events:none}
.linebg div{position:absolute;left:0;right:0;height:var(--lh)}
.linebg .pc{background:var(--pcline);box-shadow:inset 3px 0 0 var(--copper)}
.linebg .err{background:var(--errline)}
.linebg .warn{background:var(--warn-soft)}
.linebg .cur{background:color-mix(in srgb,var(--sunk) 45%,transparent)}
pre.hl,textarea.src{margin:0;padding:8px 24px 40px 12px;font:400 var(--fs-code)/var(--lh) var(--f-mono);tab-size:8;white-space:pre;letter-spacing:0;border:0;font-variant-ligatures:none}
pre.hl{position:relative;color:var(--ink);pointer-events:none;min-height:100%}
textarea.src{position:absolute;inset:0;width:100%;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--ink);outline:none;z-index:1}
textarea.src::selection{background:var(--sel);color:transparent}
.t-mn{color:var(--t-mn);font-weight:600}.t-reg{color:var(--t-reg)}.t-dir{color:var(--t-dir);font-weight:600}.t-sym{color:var(--t-sym)}.t-usym{color:var(--ink)}
.t-num{color:var(--t-num)}.t-str{color:var(--t-str)}.t-lbl{color:var(--t-lbl);font-weight:600}.t-com{color:var(--t-com);font-style:italic}.t-fn{color:var(--t-fn)}
.t-err{color:var(--t-err);text-decoration:wavy underline;text-underline-offset:3px}
.ac{position:absolute;z-index:20;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);min-width:260px;max-width:420px;padding:3px;font:12.5px/1.3 var(--f-mono)}
.ac div{padding:4px 8px;border-radius:4px;display:flex;justify-content:space-between;gap:12px;cursor:pointer}
.ac div.on{background:var(--accent-soft)}
.ac div span{color:var(--ink-3);font-family:var(--f-ui);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{position:fixed;z-index:30;max-width:360px;background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 9px;font:12.5px/1.4 var(--f-ui);pointer-events:none;box-shadow:var(--shadow)}
.tip b{font-family:var(--f-mono);font-weight:600}
.console{height:150px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface);min-height:0}
.console .hd{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line-2)}
.console ul{list-style:none;margin:0;padding:4px 0;overflow:auto;flex:1;font-size:13px}
.console li{display:grid;grid-template-columns:18px auto 1fr;gap:8px;padding:3px 10px;align-items:start;cursor:default}
.console li.go{cursor:pointer}.console li.go:hover{background:var(--sunk)}
.console li .ln{font:500 12px var(--f-mono);color:var(--ink-3);white-space:nowrap;padding-top:1px}
.console li .m{overflow-wrap:anywhere}
.console li .h{display:block;color:var(--ink-3);font-size:12.5px}
.sev{width:14px;height:14px;border-radius:3px;margin-top:2px;display:grid;place-items:center;font:700 10px/1 var(--f-ui);color:#fff}
.sev.error{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.info{background:var(--ink-3)}.sev.run{background:var(--accent)}

/* ---------- rack panels ---------- */
.panel{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.panel>header{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;user-select:none}
.panel>header h4{margin:0;font:600 13px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);flex:1}
.panel>header .chev{transition:transform .15s;color:var(--ink-3)}
.panel.closed>header .chev{transform:rotate(-90deg)}
.panel.closed>.pb{display:none}
.pb{padding:0 10px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);height:24px;padding:0 8px;font:600 11.5px var(--f-ui);cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.mini{height:24px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font:500 12px var(--f-ui);padding:0 4px}

/* board */
.boards{display:grid;gap:8px}
.port{border-radius:8px;background:var(--pcb);color:var(--silk);padding:8px 10px 10px;position:relative;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 1.4px);background-size:9px 9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.port-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.port-head select{background:var(--pcb-2);color:var(--silk);border:1px solid rgba(255,255,255,.18);border-radius:5px;height:24px;font:700 12.5px var(--f-cond);letter-spacing:.08em;padding:0 4px}
.port-head .note{font:500 11px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--silk-2);margin-left:auto}
.port .seg{border-color:rgba(255,255,255,.2)}
.port .seg button{background:var(--pcb-2);color:var(--silk-2);height:22px;font-size:11px}
.port .seg button.on{background:var(--silk);color:var(--pcb-2)}
.pins{display:grid;grid-template-columns:34px repeat(8,minmax(0,1fr));align-items:center;row-gap:3px;text-align:center}
.pins .rl{font:600 10.5px var(--f-cond);letter-spacing:.1em;color:var(--silk-2);text-align:left}
.pins .pn{font:700 11px var(--f-cond);color:var(--silk);letter-spacing:.05em}
.led{width:18px;height:18px;border-radius:50%;margin:3px auto;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.18),transparent 45%),var(--led-off);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.35);transition:background .05s}
.led.on{background:radial-gradient(circle at 40% 35%,#fff 0,#FFD2CC 18%,var(--led-on) 55%,#C8261C 100%);box-shadow:0 0 10px 2px rgba(255,68,54,.55),inset 0 0 0 1px rgba(0,0,0,.2)}
.led.nd{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(233,242,236,.35);border:1px dashed rgba(233,242,236,.25)}
.bit{font:500 12px var(--f-mono);color:var(--silk);border-radius:3px;line-height:17px}
.bit.z{color:var(--silk-2);opacity:.55}
.bit.fl{background:rgba(255,196,120,.35)}
.dip{width:16px;height:28px;margin:2px auto 0;border-radius:3px;background:var(--dip);border:0;padding:0;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.dip::after{content:"";position:absolute;left:3px;right:3px;height:11px;border-radius:2px;background:#F3F1EA;top:3px;transition:top .12s}
.dip.lo::after{top:14px}
.dip.out{opacity:.4}
.swv{font:600 10px var(--f-mono);color:var(--silk-2)}
.anl{margin-top:8px;border-radius:8px;background:var(--scope);padding:6px 8px 4px}
.anl-head{display:flex;align-items:center;gap:8px;color:#A9C2B7;font:600 11px var(--f-cond);letter-spacing:.1em;text-transform:uppercase}

.scope{margin-top:8px;border-radius:6px;background:var(--scope)}

.calcbox{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:6px 0}

.stackfig{font:12px/1.5 var(--f-mono);background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;overflow:auto;white-space:pre;margin:6px 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:500;z-index:50;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}

<script>/* ATxmega128A1U definitions — the subset of ATxmega128A1Udef.inc this bench models.
   Every symbol is stored upper-cased for case-insensitive lookup. */
(function (XL) {
'use strict';
const SYM = Object.create(null);
const ADDR = new Map();          // io address -> preferred display name
function def(n, v, k, d) {
  SYM[n.toUpperCase()] = { n: n, v: v, k: k, d: d || '' };
  if (k === 'io' && !ADDR.has(v)) ADDR.set(v, n);
}
const hx = (v, w) => '0x' + v.toString(16).toUpperCase().padStart(w || 2, '0');

/* ---------- CPU ---------- */
const CPU = [
  ['CCP', 0x34, 'Configuration Change Protection: write CCP_IOREG_gc (0xD8) to unlock protected I/O (e.g. CLK_CTRL) for 4 instructions'],
  ['RAMPD', 0x38, 'Ramp D (extends LDS/STS addresses past 64 KB)'],
  ['RAMPX', 0x39, 'Ramp X'], ['RAMPY', 0x3A, 'Ramp Y'], ['RAMPZ', 0x3B, 'Ramp Z (extends Z for ELPM)'],
  ['EIND', 0x3C, 'Extended indirect (EIJMP/EICALL)'],
  ['SPL', 0x3D, 'Stack pointer low byte'], ['SPH', 0x3E, 'Stack pointer high byte'],
  ['SREG', 0x3F, 'Status register: I T H S V N Z C'],
];
CPU.forEach(([n, a, d]) => { def('CPU_' + n, a, 'io', d); });
CPU.forEach(([n, a, d]) => { def(n, a, 'io', d + ' (alias of CPU_' + n + ')'); });
def('CCP_SPM_gc', 0x9D, 'gc', 'CCP signature for SPM'); def('CCP_IOREG_gc', 0xD8, 'gc', 'CCP signature that unlocks protected I/O registers');
'CZNVSHTI'.split('').forEach((f, i) => {
  def('CPU_' + f + '_bm', 1 << i, 'bm', 'SREG ' + f + ' flag mask'); def('CPU_' + f + '_bp', i, 'bp', 'SREG ' + f + ' flag bit');
  def('SREG_' + f, i, 'bp', 'SREG ' + f + ' flag bit number');
});

/* ---------- GPIO + VPORT ---------- */
for (let i = 0; i < 16; i++) {
  const h = i.toString(16).toUpperCase();
  def('GPIO_GPIO' + h, i, 'io', 'General-purpose I/O register ' + h + ' (bit-addressable)');
  def('GPIO' + h, i, 'io', 'General-purpose I/O register ' + h);
}
['DIR', 'OUT', 'IN', 'INTFLAGS'].forEach((r, j) => {
  for (let v = 0; v < 4; v++) def('VPORT' + v + '_' + r, 0x10 + 4 * v + j, 'io',
    'Virtual port ' + v + ' ' + r + ' — mirrors the PORT mapped by PORTCFG_VPCTRL' + (v < 2 ? 'A' : 'B') + '; reachable by IN/OUT/SBI/CBI/SBIS/SBIC');
});

/* ---------- PORTs ---------- */
const PORTS = { A: 0x600, B: 0x620, C: 0x640, D: 0x660, E: 0x680, F: 0x6A0, H: 0x6E0, J: 0x700, K: 0x720, Q: 0x7C0, R: 0x7E0 };
const PORT_REGS = [
  ['DIR', 0x00, 'Direction: 1 = output, 0 = input. Writing replaces all 8 bits.'],
  ['DIRSET', 0x01, 'Write 1s to make those pins outputs; 0 bits are untouched. Reads return DIR.'],
  ['DIRCLR', 0x02, 'Write 1s to make those pins inputs; 0 bits are untouched. Reads return DIR.'],
  ['DIRTGL', 0x03, 'Write 1s to toggle those DIR bits. Reads return DIR.'],
  ['OUT', 0x04, 'Output value driven on output pins. Writing replaces all 8 bits.'],
  ['OUTSET', 0x05, 'Write 1s to set those OUT bits; 0 bits are untouched. Reads return OUT.'],
  ['OUTCLR', 0x06, 'Write 1s to clear those OUT bits; 0 bits are untouched. Reads return OUT.'],
  ['OUTTGL', 0x07, 'Write 1s to toggle those OUT bits; 0 bits are untouched. Reads return OUT.'],
  ['IN', 0x08, 'Pin levels (read-only). Output pins read back the level they drive.'],
  ['INTCTRL', 0x09, 'INT0LVL[1:0] and INT1LVL[3:2] interrupt levels'],
  ['INT0MASK', 0x0A, 'Pins that can trigger PORT INT0'],
  ['INT1MASK', 0x0B, 'Pins that can trigger PORT INT1'],
  ['INTFLAGS', 0x0C, 'INT0IF (bit 0), INT1IF (bit 1); write 1 to clear'],
  ['REMAP', 0x0E, 'Pin remap control'],
];
for (let i = 0; i < 8; i++) PORT_REGS.push(['PIN' + i + 'CTRL', 0x10 + i, 'Pin ' + i + ' control: INVEN (bit 6), OPC[5:3] pull config, ISC[2:0] sense'])
Object.keys(PORTS).forEach(p => PORT_REGS.forEach(([r, o, d]) => def('PORT' + p + '_' + r, PORTS[p] + o, 'io', 'PORT' + p + ' ' + d)));
for (let i = 0; i < 8; i++) { def('PIN' + i + '_bm', 1 << i, 'bm', 'Pin ' + i + ' mask'); def('PIN' + i + '_bp', i, 'bp', 'Pin ' + i + ' bit position'); }
[['INT0LVL', 0, 0x03], ['INT1LVL', 2, 0x0C]].forEach(([n, gp, gm]) => {
  def('PORT_' + n + '_gm', gm, 'gm', 'PORT INTCTRL ' + n + ' group mask'); def('PORT_' + n + '_gp', gp, 'gp', '');
  ['OFF', 'LO', 'MED', 'HI'].forEach((l, i) => def('PORT_' + n + '_' + l + '_gc', i << gp, 'gc', 'PORT ' + n + ' ' + l));
});
def('PORT_INT0IF_bm', 1, 'bm', 'PORT INT0 flag'); def('PORT_INT0IF_bp', 0, 'bp', ''); def('PORT_INT1IF_bm', 2, 'bm', 'PORT INT1 flag'); def('PORT_INT1IF_bp', 1, 'bp', '');
def('PORT_SRLEN_bm', 0x80, 'bm', 'Slew rate limit'); def('PORT_INVEN_bm', 0x40, 'bm', 'Invert pin I/O'); def('PORT_INVEN_bp', 6, 'bp', '');
def('PORT_OPC_gm', 0x38, 'gm', 'Output/pull configuration'); def('PORT_OPC_gp', 3, 'gp', '');
['TOTEM', 'BUSKEEPER', 'PULLDOWN', 'PULLUP', 'WIREDOR', 'WIREDAND', 'WIREDORPULL', 'WIREDANDPULL'].forEach((n, i) => def('PORT_OPC_' + n + '_gc', i << 3, 'gc', 'PINnCTRL OPC: ' + n.toLowerCase()));
def('PORT_ISC_gm', 0x07, 'gm', 'Input sense configuration'); def('PORT_ISC_gp', 0, 'gp', '');
[['BOTHEDGES', 0], ['RISING', 1], ['FALLING', 2], ['LEVEL', 3], ['INPUT_DISABLE', 7]].forEach(([n, v]) => def('PORT_ISC_' + n + '_gc', v, 'gc', 'PINnCTRL ISC: ' + n.toLowerCase()));

/* ---------- PORTCFG (virtual port mapping) ---------- */
[['MPCMASK', 0xB0], ['VPCTRLA', 0xB2], ['VPCTRLB', 0xB3], ['CLKEVOUT', 0xB4], ['EBIOUT', 0xB5], ['EVCTRL', 0xB6]].forEach(([n, a]) =>
  def('PORTCFG_' + n, a, 'io', n === 'VPCTRLA' ? 'Virtual port map: VP0MAP[3:0], VP1MAP[7:4] (reset: VP0=PORTA, VP1=PORTB)' :
    n === 'VPCTRLB' ? 'Virtual port map: VP2MAP[3:0], VP3MAP[7:4] (reset: VP2=PORTC, VP3=PORTD)' : 'Port configuration ' + n));
const VPNAMES = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'J', 'K', 'L', 'M', 'N', 'P', 'Q', 'R'];
VPNAMES.forEach((p, i) => {
  def('PORTCFG_VP02MAP_PORT' + p + '_gc', i, 'gc', 'Map virtual port 0 or 2 to PORT' + p);
  def('PORTCFG_VP13MAP_PORT' + p + '_gc', i << 4, 'gc', 'Map virtual port 1 or 3 to PORT' + p);
});
def('PORTCFG_VP0MAP_gm', 0x0F, 'gm', ''); def('PORTCFG_VP1MAP_gm', 0xF0, 'gm', ''); def('PORTCFG_VP2MAP_gm', 0x0F, 'gm', ''); def('PORTCFG_VP3MAP_gm', 0xF0, 'gm', '');

`;***************************************************************
;* USARTD0 at 70 kbps, 8O1, 2 MHz (Lab 5 settings).
;* Prints a prompt, then echoes every character with the RXC
;* interrupt while MAIN blinks the green LED on PD5 (active low).
;* Open the Serial terminal panel, run, and type.
;***************************************************************
.include "ATxmega128A1Udef.inc"

.equ BSEL   = 101               ; 2^7 * (2 MHz / (16 * 70 kHz) - 1) = 100.57
.equ BSCALE = -7                ; actual baud = 69,869 Hz (-0.19 %)

.org 0x0000
        rjmp  MAIN
.org USARTD0_RXC_vect
        rjmp  USARTD0_RX_ISR

.org 0x0100
MAIN:   ldi   r16, low(0x3FFF)
        out   CPU_SPL, r16
        ldi   r16, high(0x3FFF)
        out   CPU_SPH, r16
        rcall USART_INIT
        ldi   ZL, low(PROMPT<<1)
        ldi   ZH, high(PROMPT<<1)
        rcall OUT_STRING
        ldi   r16, USART_RXCINTLVL_LO_gc
        sts   USARTD0_CTRLA, r16    ; receive-complete interrupt, low level
        ldi   r16, PMIC_LOLVLEN_bm
        sts   PMIC_CTRL, r16
        sei
        ldi   r16, PIN5_bm          ; green LED
        sts   PORTD_OUTSET, r16     ; off (active low)
        sts   PORTD_DIRSET, r16
LOOP:   sts   PORTD_OUTTGL, r16
        rcall DELAY
        rjmp  LOOP

;--- USART_INIT: TX = PD3, RX = PD2 ---
USART_INIT:
        push  r16
        ldi   r16, PIN3_bm
        sts   PORTD_OUTSET, r16     ; idle high first...
        sts   PORTD_DIRSET, r16     ; ...then TX output
        ldi   r16, PIN2_bm
        sts   PORTD_DIRCLR, r16     ; RX input
        ldi   r16, USART_CMODE_ASYNCHRONOUS_gc | USART_PMODE_ODD_gc | USART_CHSIZE_8BIT_gc
        sts   USARTD0_CTRLC, r16    ; 8O1 = 0x33
        ldi   r16, ((BSCALE & 0x0F) << 4) | high(BSEL)
        sts   USARTD0_BAUDCTRLB, r16
        ldi   r16, low(BSEL)
        sts   USARTD0_BAUDCTRLA, r16
        ldi   r16, USART_TXEN_bm | USART_RXEN_bm
        sts   USARTD0_CTRLB, r16
        pop   r16
        ret

;--- OUT_CHAR: send r16 once the data register is empty ---
OUT_CHAR:
        push  r17
OC_WAIT:
        lds   r17, USARTD0_STATUS
        sbrs  r17, USART_DREIF_bp
        rjmp  OC_WAIT
        sts   USARTD0_DATA, r16
        pop   r17
        ret

;--- OUT_STRING: send the null-terminated string at Z ---
OUT_STRING:
        push  r16
OS_NEXT:
        lpm   r16, Z+
        cpi   r16, 0
        breq  OS_DONE
        rcall OUT_CHAR
        rjmp  OS_NEXT
OS_DONE:
        pop   r16
        ret

;--- RX ISR: echo the received character ---
USARTD0_RX_ISR:
        push  r16
        in    r16, CPU_SREG
        push  r16
        lds   r16, USARTD0_DATA     ; reading DATA clears RXCIF
        rcall OUT_CHAR
        pop   r16
        out   CPU_SREG, r16
        pop   r16
        reti

;--- DELAY: about 100 ms at 2 MHz ---
DELAY:  push  r18
        push  r19
        push  r20
        ldi   r20, 10
D0:     ldi   r18, 26
D1:     ldi   r19, 255
D2:     dec   r19
        brne  D2
        dec   r18
        brne  D1
        dec   r20
        brne  D0
        pop   r20
        pop   r19
        pop   r18
        ret

PROMPT: .db "Hello from the XMEGA! Type something:", 13, 10, 0

const lvl = n => '<span class="lvl" title="Level ' + n + '">' + [1, 2, 3].map(i => '<i class="' + (i <= n ? 'on' : '') + '"></i>').join('') + '</span>';
function statusOf(id) { const p = App.progress[id]; return p === 'ok' ? 'ok' : p === 'att' ? 'att' : ''; }
function renderList() {
  App.P = null; App.V = null;
  const solved = XL.problems.filter(p => statusOf(p.id) === 'ok').length;
  let h = '<div class="eyebrow">ATxmega128A1U practice</div><h2>Problem bank</h2><p class="muted" style="margin:0 0 4px">Every problem makes a fresh variant — new ports, pins, clocks and numbers — and grades it by running hidden tests on the simulator.</p>';
  h += '<h3>Sandbox <span class="progress">examples</span></h3><div class="samples">' + XL.SAMPLES.map(s => '<button class="btn sm" data-sample="' + s.id + '" title="' + esc(s.blurb) + '">' + esc(s.title) + '</button>').join('') + '</div>';
  CATS.forEach(c => {
    const ps = XL.problems.filter(p => p.cat === c); const n = ps.filter(p => statusOf(p.id) === 'ok').length;
    h += '<h3>' + c + ' <span class="progress">' + n + ' / ' + ps.length + '</span></h3><div class="plist">' + ps.map(p => '<button class="pitem" data-p="' + p.id + '"><span class="dot ' + statusOf(p.id) + '" title="' + ({ ok: 'Solved', att: 'Attempted', '': 'Not tried' })[statusOf(p.id)] + '"></span><span><span class="t">' + esc(p.title) + '</span><br><span class="b">' + esc(p.blurb) + (p.kind === 'answer' ? ' · answer' : ' · code') + '</span></span>' + lvl(p.level) + '</button>').join('') + '</div>';
  });

  sheet.innerHTML = h;
  sheet.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => openProblem(b.dataset.p)));
  sheet.querySelectorAll('[data-sample]').forEach(b => b.addEventListener('click', () => openSample(b.dataset.sample)));
  $('fname').innerHTML = App.docKey && App.docKey.startsWith('sb:') ? 'sandbox / <b>' + esc(App.docKey.slice(3)) + '.asm</b>' : $('fname').innerHTML;
}
function applyVariantBoard(V) {
  const b = V.board || {}; if (b.slots) App.st.slots = b.slots.slice(0, 2);
  Object.assign(App.st.pol, b.led || {}); if (b.ext) Object.keys(b.ext).forEach(L => { App.st.ext[L] = b.ext[L]; });
  if (b.timer) App.st.timer = b.timer; App.st.anlSlot = 0; App.save(); panels.buildBoard();
  if (b.usart) panels.openTerm(b.usart, b.term);
}
function openSample(id, noView) {
  const s = XL.SAMPLES.find(x => x.id === id); if (!s) return;
  App.running = false; App.st.slots = s.slots.slice(); Object.assign(App.st.pol, s.pol); if (s.timer) App.st.timer = s.timer;
  App.st.cur = { mode: 'sample', id }; App.save(); panels.buildBoard(); if (s.usart) panels.openTerm(s.usart, s.term); setClock(s.clock || 2e6);
  loadDoc('sb:' + id, s.src); $('fname').innerHTML = 'sandbox / <b>' + esc(id) + '.asm</b>';
  assemble(true); renderList(); if (!noView) showView('code');
}
function openProblem(id, seed) {
  const p = XL.problems.find(x => x.id === id); if (!p) return renderList();
  seed = seed || (App.progress['seed.' + id]) || 1; App.progress['seed.' + id] = seed; store.set('progress', App.progress);
  const V = p.gen(G.RNG(seed * 7919 + 13), seed); V.seed = seed; App.P = p; App.V = V; App.running = false;
  App.st.cur = { mode: 'problem', id, seed }; applyVariantBoard(V); setClock(V.clockHz || 2e6);
  if (p.kind === 'code') { loadDoc('p:' + id + ':' + seed, V.starter); $('fname').innerHTML = esc(p.cat.toLowerCase()) + ' / <b>' + esc(id) + '.asm</b>'; assemble(true); }
  else if (!App.docKey || App.docKey.startsWith('p:')) { loadDoc('sb:scratch', XL.SAMPLES[0].src); $('fname').innerHTML = 'sandbox / <b>scratch.asm</b>'; assemble(true); }
  renderProblem(); App.save();
}
function hintKey() { return App.P.id + ':' + App.V.seed; }
function attempted() { return !!App.attempts[hintKey()]; }
function renderProblem(results) {
  const p = App.P, V = App.V; if (!p) return renderList();
  let h = '<button class="back" id="bBack">← All problems</button><div class="eyebrow" style="margin-top:10px">' + esc(p.cat) + ' · level ' + p.level + ' · ' + (p.kind === 'code' ? 'write code' : 'answer') + '</div><h2>' + esc(p.title) + '</h2>';
  h += '<div class="variant"><span class="chip">Variant ' + V.seed + '</span><span class="muted" style="font-size:12.5px">' + esc(V.summary) + '</span><button class="btn sm" id="bNew" title="Generate a new randomized version">New variant</button></div>';
  h += '<div class="stmt">' + V.statement + '</div>';
  if (p.kind === 'answer') h += '<form class="form" id="aform" autocomplete="off">' + V.form.map(renderField).join('') + '</form>';
  h += '<div class="actions">' + (p.kind === 'code' ? '<button class="btn primary" id="bGrade">Run hidden tests</button><button class="btn" id="bStarter" title="Replace the editor contents with the starter code">Starter code</button>' : '<button class="btn primary" id="bGrade">Check answers</button>') +
    '<button class="btn" id="bHint"></button><button class="btn" id="bSol"></button>' + (V.verify ? '<button class="btn" id="bVerify" title="Load this program into the editor so you can step through it">Trace in simulator</button>' : '') + '</div>';
  h += '<div id="hints"></div><div id="results"></div><div id="solution"></div>';
  sheet.innerHTML = h; sheet.scrollTop = 0;
  $('bBack').addEventListener('click', () => { App.st.cur = { mode: 'list' }; App.save(); renderList(); });
  $('bNew').addEventListener('click', () => openProblem(p.id, 2 + Math.floor(Math.random() * 99990)));
  $('bGrade').addEventListener('click', grade);
  $('bHint').addEventListener('click', () => { App.hints[hintKey()] = Math.min(3, (App.hints[hintKey()] || 0) + 1); renderHints(); });
  $('bSol').addEventListener('click', () => { if (!attempted()) return; App.hints[hintKey()] = 3; renderHints(); $('solution').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  if ($('bStarter')) $('bStarter').addEventListener('click', e => confirmBtn(e.currentTarget, 'Replace my code?', () => { ed.value = V.starter; App.dirty = true; saveDoc(); assemble(true); toast('Starter code loaded'); }));
  if ($('bVerify')) $('bVerify').addEventListener('click', () => {
    loadDoc('sb:trace', V.verify.src); $('fname').innerHTML = 'trace / <b>stack.asm</b>'; assemble(true);
    App.bps = new Set(V.verify.breaks.map(n => App.asm && App.asm.syms[n] ? App.asm.syms[n].line : 0).filter(Boolean)); syncBps(); showView('code'); toast(App.bps.size ? 'Breakpoints set at ★1, ★2, ★3 — press Run, then watch the Stack panel' : 'Loaded — step with F11 and watch the Stack panel');
  });
  if (p.kind === 'answer') $('aform').addEventListener('submit', e => { e.preventDefault(); grade(); });
  renderHints(); if (results) renderResults(results);
}
function renderField(f) {
  if (f.type === 'select') return '<div class="field"><label for="f_' + f.id + '">' + f.label + '</label><select id="f_' + f.id + '" name="' + f.id + '">' + f.options.map(o => '<option value="' + o[0] + '">' + esc(o[1]) + '</option>').join('') + '</select></div>';
  if (f.type === 'text') return '<div class="field"><label for="f_' + f.id + '">' + f.label + '</label><input id="f_' + f.id + '" name="' + f.id + '" placeholder="' + esc(f.placeholder || '') + '" spellcheck="false"></div>';
  if (f.type === 'stack') return '<div class="field"><span class="lab">' + f.label + '</span><div class="stackform">' + f.rows.map(r => '<span>' + hx(r.a, 4) + '</span><input id="f_' + r.id + '" name="' + r.id + '" placeholder="0x.." spellcheck="false" aria-label="Byte at ' + hx(r.a, 4) + '">').join('') + '<span>SP →</span><span class="muted" style="font-family:var(--f-ui)">next free byte</span></div></div>';
  if (f.type === 'mc') return '<div class="q">' + (f.diagram || '') + '<p class="p">' + f.prompt + '</p><div class="opts">' + f.options.map(o => '<label class="opt" id="o_' + f.id + '_' + o[0] + '"><input type="radio" name="' + f.id + '" value="' + o[0] + '"><span>' + o[1] + '</span></label>').join('') + '</div></div>';
  if (f.type === 'order') return '<div class="q"><p class="p">' + f.prompt + '</p><div class="orderlist">' + f.steps.map(st => '<select id="f_' + st.id + '" name="' + st.id + '" aria-label="Position of: ' + esc(st.text) + '"><option value="">#</option>' + f.steps.map((_, i) => '<option value="' + (i + 1) + '">' + (i + 1) + '</option>').join('') + '</select><span>' + esc(st.text) + '</span>').join('') + '</div></div>';
  if (f.type === 'grid') {
    let h = '<div class="field"><span class="lab">' + f.label + '</span><div class="tblwrap"><table class="gridq"><thead><tr><th>Addr</th>' + f.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>';
    f.rows.forEach(ad => { h += '<tr><td class="ad">' + hx(ad, 4) + '</td>' + f.cols.map((c, i) => '<td><input id="f_g' + i + '_' + ad.toString(16) + '" name="g' + i + '_' + ad.toString(16) + '" placeholder="··" spellcheck="false" aria-label="' + esc(c) + ', byte at ' + hx(ad, 4) + '"></td>').join('') + '</tr>'; });
    h += '<tr class="spr"><td class="ad">SP =</td>' + f.cols.map((c, i) => '<td><input id="f_sp' + i + '" name="sp' + i + '" placeholder="0x…" spellcheck="false" aria-label="SP at ' + esc(c) + '"></td>').join('') + '</tr>';
    h += '<tr class="spr"><td class="ad">PC =</td>' + f.cols.map((c, i) => '<td>' + (f.pcCols.includes(i) ? '<input id="f_pc' + i + '" name="pc' + i + '" placeholder="0x…" spellcheck="false" aria-label="PC at ' + esc(c) + '">' : '') + '</td>').join('') + '</tr>';
    return h + '</tbody></table></div></div>';
  }
  if (f.type === 'label') return '<div class="q">' + f.diagram + '<p class="p">' + f.prompt + '</p><div class="labelrow">' + f.marks.map(m => '<b>' + m.n + '</b><select id="f_' + m.id + '" name="' + m.id + '" aria-label="Part ' + m.n + '"><option value="">choose…</option>' + f.options.map(o => '<option value="' + o[0] + '">' + esc(o[1]) + '</option>').join('') + '</select>').join('') + '</div></div>';
  return '';
}
function confirmBtn(btn, label, fn) {
  if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; fn(); return; }
  btn.dataset.orig = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label;
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3500);
}
function renderHints() {
  const k = hintKey(), n = App.hints[k] || 0, V = App.V, att = attempted();
  const hb = $('bHint'), sb = $('bSol');
  hb.textContent = n === 0 ? 'Hint 1 · nudge' : n === 1 ? 'Hint 2 · approach' : n === 2 ? 'Hint 3 · full solution' : 'All hints shown'; hb.disabled = n >= 3;
  sb.textContent = App.P.kind === 'code' ? 'Model solution' : 'Worked solution'; sb.disabled = !att; sb.title = att ? '' : 'Available after your first attempt';
  let h = '';
  if (n >= 1) h += '<div class="hint"><b class="k">Nudge</b>' + V.hints[0] + '</div>';
  if (n >= 2) h += '<div class="hint"><b class="k">Approach</b>' + V.hints[1] + '</div>';
  if (n >= 3 && !att) h += '<p class="lock">🔒 The full solution unlocks after your first ' + (App.P.kind === 'code' ? 'test run' : 'check') + '.</p>';
  $('hints').innerHTML = h;
  $('solution').innerHTML = n >= 3 && att ? solutionHTML() : '';
  const lb = $('bSolLoad'); if (lb) lb.addEventListener('click', e => confirmBtn(e.currentTarget, 'Replace my code?', () => { ed.value = V.solution; saveDoc(); assemble(true); showView('code'); toast('Model solution loaded into the editor'); }));
  const cb = $('bSolCopy'); if (cb) cb.addEventListener('click', () => { const t = V.solution; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied'), () => toast('Copy blocked — select the text instead')); });
}
function solutionHTML() {
  const V = App.V, p = App.P;
  if (p.kind !== 'code') return '<div class="sol"><div class="sol-head"><span class="eyebrow">Worked solution</span></div><div style="padding:8px 12px">' + V.worked() + '</div></div>';
  const rows = V.solution.split('\n').map(line => {
    if (/^\s*;/.test(line)) return '<tr class="hd"><td colspan="2">' + esc(line.replace(/^\s*;+\s?/, '').replace(/\*+/g, '').trim()) + '</td></tr>';
    let q = false, i = 0; for (; i < line.length; i++) { if (line[i] === '"') q = !q; if (line[i] === ';' && !q) break; }
    const code = line.slice(0, i).replace(/\s+$/, ''), com = i < line.length ? line.slice(i + 1).trim() : '';
    return '<tr><td>' + (esc(code) || '&nbsp;') + '</td><td class="c">' + esc(com) + '</td></tr>';
  }).join('');
  return '<div class="sol"><div class="sol-head"><span class="eyebrow">Model solution</span><button class="btn sm" id="bSolCopy">Copy</button><button class="btn sm" id="bSolLoad">Load into editor</button></div><div class="tblwrap"><table class="asm"><thead><tr><th>Assembly code</th><th>Comments</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}
async function grade() {
  const p = App.P, V = App.V; if (!p) return;
  const btn = $('bGrade'); btn.disabled = true; $('results').innerHTML = '<div class="summary run">' + (p.kind === 'code' ? 'Running hidden tests…' : 'Checking…') + '</div>';
  let res;
  try {
    if (p.kind === 'code') {
      saveDoc(); const src = ed.value; assemble(true); await G.tick();
      res = await p.grade(V, src);
      const a = XL.asm.assemble(src);
      const w = a.ok ? a.warnings.filter(x => /bit position|bit mask|register address|read-only/.test(x.msg)) : [];
      if (w.length) res.push(G.note('Assembler warnings', '<ul>' + w.map(x => '<li>Line ' + x.line + ': ' + esc(x.msg) + ' <span class="muted">' + esc(x.hint) + '</span></li>').join('') + '</ul>', false));
    } else {
      const ans = {}; sheet.querySelectorAll('#aform input, #aform select').forEach(el => { if (el.type === 'radio') { if (el.checked) ans[el.name] = el.value; } else ans[el.name] = el.value; });
      res = await p.grade(V, ans); markAnswers(res, ans);
    }
  } catch (e) { res = [G.fail('Grader error', esc(e.message))]; }
  btn.disabled = false;
  App.attempts[hintKey()] = 1; store.set('attempts', App.attempts);
  const ok = res.every(r => r.pass || r.advisory);
  if (ok) App.progress[p.id] = 'ok'; else if (App.progress[p.id] !== 'ok') App.progress[p.id] = 'att'; store.set('progress', App.progress);
  renderHints(); renderResults(res);
}
function markAnswers(res, ans) {
  const V = App.V;
  if (V.q) V.q.forEach(q => {
    if (q.type === 'order') q.steps.forEach(st => { const el = $('f_' + st.id); if (el) el.style.borderColor = +ans.o_sei === q.steps.length ? 'var(--ok)' : (st.id === 'o_sei' ? 'var(--bad)' : ''); });
    else if (q.type === 'mc') q.options.forEach(o => { const el = $('o_' + q.id + '_' + o[0]); if (el) el.className = 'opt' + (o[0] === q.answer && ans[q.id] ? ' good' : '') + (ans[q.id] === o[0] && o[0] !== q.answer ? ' bad' : ''); });
    else q.marks.forEach(m => { const el = $('f_' + m.id); if (el) el.parentNode && (el.style.borderColor = ans[m.id] === m.answer ? 'var(--ok)' : 'var(--bad)'); });
  });
  else sheet.querySelectorAll('#aform .field').forEach(f => { f.classList.remove('good', 'bad'); });
  if (App.P.id === 'timer-math') [['N', 0], ['PER', 1], ['CTRLA', 2]].forEach(([k, i]) => { const f = $('f_' + k).closest('.field'); f.classList.add(res[i] && res[i].pass ? 'good' : 'bad'); });
  if (App.P.id === 'stack-snap') V.snaps.forEach((sn, c) => {
    const set = (id, ok) => { const el = $('f_' + id); if (el) el.style.borderColor = ok ? 'var(--ok)' : 'var(--bad)'; };
    V.rows.forEach(ad => { const m = sn.mem.find(x => x.a === ad); if (m) set('g' + c + '_' + ad.toString(16), G.num(ans['g' + c + '_' + ad.toString(16)]) === m.v); });
    set('sp' + c, G.num(ans['sp' + c]) === sn.sp); if (V.form[0].pcCols.includes(c)) set('pc' + c, G.num(ans['pc' + c]) === sn.pc);
  });
  if (App.P.id === 'stack-trace') { ['sp1', 'sp2', 'sp3'].forEach(k => { const f = $('f_' + k).closest('.field'); f.classList.add(G.num(ans[k]) === V.ans[k] ? 'good' : 'bad'); }); V.ans.mem.forEach(m => { const el = $('f_m' + m.a.toString(16)); el.style.borderColor = G.num(el.value) === m.v ? 'var(--ok)' : 'var(--bad)'; }); }
}
function renderResults(res) {
  const req = res.filter(r => !r.advisory), np = req.filter(r => r.pass).length; const ok = np === req.length;
  let h = '<div class="summary ' + (ok ? 'ok' : 'bad') + '">' + (ok ? (App.P.kind === 'code' ? 'All hidden tests passed' : 'All correct') : (App.P.kind === 'code' ? 'Some tests failed' : 'Not quite')) + '<span class="n">' + np + ' / ' + req.length + '</span></div><ul class="res">';
  res.forEach(r => {
    const c = r.advisory ? 'adv' : r.pass ? 'pass' : 'fail';
    h += '<li class="' + c + '"><details' + (!r.pass ? ' open' : '') + '><summary><span class="ic">' + (r.advisory ? '!' : r.pass ? '✓' : '✕') + '</span><span class="nm">' + esc(r.name) + '</span></summary>' + (r.detail ? '<div class="det">' + r.detail + '</div>' : '') + '</details></li>';
  });
  $('results').innerHTML = h + '</ul>' + (ok && App.P.kind === 'code' ? '<p class="muted" style="font-size:12.5px">Try <b>New variant</b> for a fresh version with different pins and numbers.</p>' : '');
}

/* ---------------- views / controls ---------------- */

$('mtabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showView(b.dataset.v); });
$('bAsm').innerHTML = ICON.asm + '<span>Assemble</span>'; $('bStep').innerHTML = ICON.step; $('bOver').innerHTML = ICON.over; $('bOut').innerHTML = ICON.out; $('bReset').innerHTML = ICON.reset; $('bRef').innerHTML = ICON.book + '<span>Reference</span>';
$('bAsm').addEventListener('click', () => { if (assemble()) toast('Assembled — ready to run'); });
$('bRun').addEventListener('click', () => { if (App.running) pause(); else run(); });
$('bStep').addEventListener('click', stepInto); $('bOver').addEventListener('click', stepOver); $('bOut').addEventListener('click', stepOut);
$('bReset').addEventListener('click', () => { resetSim(); });
$('speed').innerHTML = SPEEDS.map(s => '<option value="' + s[0] + '">' + s[1] + '</option>').join(''); $('speed').value = App.st.speed;
$('speed').addEventListener('change', e => { App.st.speed = e.target.value; App.save(); App.lastTs = 0; });
$('clock').innerHTML = CLOCKS.map(c => '<option value="' + c[0] + '">' + c[1] + '</option>').join(''); $('clock').value = String(App.st.clock);
$('clock').addEventListener('change', e => setClock(+e.target.value));
$('bAddr').addEventListener('click', () => { App.st.showAddr = !App.st.showAddr; App.save(); $('bAddr').classList.toggle('on', App.st.showAddr); ed.setMarks({ showAddr: App.st.showAddr }); });
$('bRef').addEventListener('click', () => XL.Ref.open()); $('refClose').addEventListener('click', () => XL.Ref.close()); $('scrim').addEventListener('click', () => XL.Ref.close());
$('refTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) XL.Ref.show(b.dataset.t); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') XL.Ref.close();
  const inForm = e.target.closest && e.target.closest('input,select,#aform');
  if (e.key === 'F5') { e.preventDefault(); if (e.shiftKey) resetSim(); else if (App.running) pause(); else run(); }

  else if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); assemble(); }
});
window.addEventListener('resize', () => render(true));

/* ---------------- boot ---------------- */
const panels = XL.Panels(App);
$('bAddr').classList.toggle('on', App.st.showAddr); ed.setMarks({ showAddr: App.st.showAddr });
showView(window.innerWidth <= 1000 ? (App.st.view || 'sheet') : App.st.view);
const cur = App.st.cur;
if (cur && cur.mode === 'problem' && XL.problems.find(p => p.id === cur.id)) openProblem(cur.id, cur.seed);
else if (cur && cur.mode === 'sample' && XL.SAMPLES.find(x => x.id === cur.id)) { openSample(cur.id, true); }
else {

  openSample('knight', true); renderList();
  if (App.asm) { App.sim.run(Math.round(0.47 * App.sim.clockHz)); App.sim.stackOps = []; checkLints(); addMsg({ kind: 'info', text: 'Demo paused after 0.47 s of simulated time. Press Continue (F5) to keep it running, flip the PD0 switch to change speed, or pick a problem on the left.' }); }
  updateStatus(); render(true);
}
if (!App.P) renderList();
updateStatus(); render(true);
})(window.XL = window.XL || {});
</script>
